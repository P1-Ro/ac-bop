; acbop HUD: the CMRT Essential HUD leaderboard (by CMRT Group), cut down to
; just that, with acbop's ballast/restrictor, safety car flag and button.
; https://github.com/ac-custom-shaders-patch/acc-lua-sdk/wiki/Lua-apps

[ABOUT]
NAME = acbop HUD
AUTHOR = acbop (leaderboard from CMRT Essential HUD by CMRT Group)
VERSION = 1.0.0
DESCRIPTION = Leaderboard with each driver's ballast and restrictor, and a button to call acbop's virtual safety car.

[WINDOW_...]
NAME = acbop leaderboard
PADDING = 0,0
FUNCTION_MAIN = leaderboardMain
FUNCTION_ON_SHOW = leaderboardShow
FUNCTION_ON_HIDE = leaderboardHide
SIZE = 700, 400
FLAGS = NO_SCROLLBAR, NO_COLLAPSE, FADING, NO_BACKGROUND, NO_TITLE_BAR, FIXED_SIZE

[WINDOW_...]
NAME = acbop settings
FUNCTION_MAIN = settingsMain
SIZE = 600, 420
FLAGS = NO_COLLAPSE, MAIN
